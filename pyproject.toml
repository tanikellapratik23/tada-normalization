[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tada-normalization"
version = "1.0.0"
description = "Evidence-driven, lossless payroll data normalization"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
test = ["jsonschema==4.23.0"]
[project.scripts]
tada = "tada.__main__:main"
[tool.setuptools]
packages = ["tada"]

[tool.setuptools.package-data]
tada = ["dashboard.html"]
